name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Model-level tests that need no server
      - run: npx tsx apps/api/test/base-model.ts
      - run: npx tsx apps/api/test/photodeck.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The production compose file must parse with the example settings (required variables, healthchecks).
      - run: cp .env.production.example .env.production && docker compose -f infra/docker-compose.prod.yml --env-file .env.production config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
